# First GitHub Actions pilot: manual only, no paid or external integrations.
# This is a deterministic smoke check, NOT full milestone acceptance.
name: Manual simulation smoke (M0)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0-smoke:
    name: M0 one-day deterministic replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64" /usr/local/bin/godot
          godot --headless --version

      - name: Run two matching one-day simulations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-data" "$RUNNER_TEMP/godot-config" "$RUNNER_TEMP/godot-cache"
          export XDG_DATA_HOME="$RUNNER_TEMP/godot-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/godot-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/godot-cache"
          godot --headless --no-header --path . --script res://scripts/tools/run_simulation.gd -- \
            --scenario m0 1 42 --json > "$RUNNER_TEMP/m0-first.json"
          godot --headless --no-header --path . --script res://scripts/tools/run_simulation.gd -- \
            --scenario m0 1 42 --json > "$RUNNER_TEMP/m0-second.json"
          python3 -m json.tool "$RUNNER_TEMP/m0-first.json" > /dev/null
          cmp "$RUNNER_TEMP/m0-first.json" "$RUNNER_TEMP/m0-second.json"
          sha256sum "$RUNNER_TEMP/m0-first.json"
          echo "PASS: M0 one-day deterministic replay"

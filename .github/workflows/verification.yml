# Read-only regression CI on main; full milestone acceptance is deliberately manual.
# No secrets, external APIs, or privileged tokens.
name: Simulation verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verification.yml'
      - 'project.godot'
      - 'native/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Regression suites, or all milestone acceptance stages (longer manual run)'
        required: true
        type: choice
        default: suites
        options:
          - suites
          - full

permissions:
  contents: read

jobs:
  verify:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'full' && 'Full milestone acceptance (manual)' || 'Godot + Python regression suites' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact test source
        uses: actions/checkout@v4
        with:
          # Checkout uses the exact event commit, including the selected manual ref.
          fetch-depth: 0
          persist-credentials: false

      - name: Show revision being verified
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.scope }}" == "full" ]]; then
            test -f scripts/tools/verify_workflow.py
          fi

      - name: Set up Python 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install pinned Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64" /usr/local/bin/godot
          godot --headless --version | tee "$RUNNER_TEMP/godot-version.txt"
          grep -q '4.6.3' "$RUNNER_TEMP/godot-version.txt"

      - name: Install pinned native build toolchain
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          gcc --version | head -n 1
          g++ --version | head -n 1
          python3 -m pip install --disable-pip-version-check 'SCons==4.9.1'
          rustup toolchain install 1.91.1 --profile minimal
          cargo +1.91.1 --version

      - name: Build M20 C++ and Rust libraries and Godot bridge
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p work/native-deps work/godot-data work/godot-config work/cache
          echo "XDG_DATA_HOME=$GITHUB_WORKSPACE/work/godot-data" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$GITHUB_WORKSPACE/work/godot-config" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$GITHUB_WORKSPACE/work/cache" >> "$GITHUB_ENV"
          export XDG_DATA_HOME="$GITHUB_WORKSPACE/work/godot-data"
          export XDG_CONFIG_HOME="$GITHUB_WORKSPACE/work/godot-config"
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/work/cache"
          git -C work/native-deps init godot-cpp
          git -C work/native-deps/godot-cpp remote add origin https://github.com/godotengine/godot-cpp.git
          git -C work/native-deps/godot-cpp fetch --depth 1 origin abb196939767b7bbee0b3a380faefdcbdb118a54
          git -C work/native-deps/godot-cpp checkout --detach FETCH_HEAD
          (cd work/native-deps && godot --headless --no-header --dump-extension-api)
          python3 scripts/tools/build_native_math.py \
            --godot-cpp work/native-deps/godot-cpp \
            --api work/native-deps/extension_api.json --sanitize
          test -f native/m20/math.gdextension
          test -f native/m20/bin/libm20_math.so
          test -f native/m20/bin/libm20_cpp.so
          test -f native/m20/bin/libm20_bridge.so
          echo "Native arithmetic and bridge ready"

      - name: Godot regression suite
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'full' }}
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --no-header --path . --script res://tests/run_tests.gd \
            2>&1 | tee "$RUNNER_TEMP/godot-tests.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'godot-tests.log').read_text()
          counts = re.findall(r'(?m)^Tests: (\d+) checks, (\d+) failures$', log)
          assert counts, 'Missing Godot test summary'
          checks, failures = map(int, counts[-1])
          assert failures == 0 and checks >= 3482, (checks, failures)
          print(f'Godot regression gate passed: {checks} checks, no failures')
          PY

      - name: Python regression suite
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'full' }}
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/python-tests.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'python-tests.log').read_text()
          counts = re.findall(r'(?m)^Ran (\d+) tests in ', log)
          minimum = 166 if Path('tests/test_verification_workflow.py').is_file() else 149
          assert counts and int(counts[-1]) >= minimum, (counts, minimum)
          print(f'Python regression gate passed: {counts[-1]} tests (minimum {minimum})')
          PY
          grep -Eq '^OK$' "$RUNNER_TEMP/python-tests.log"
          ! grep -Eq '(^OK \(skipped=|^FAILED|skipped=[1-9])' "$RUNNER_TEMP/python-tests.log"

      - name: Full milestone acceptance (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'full' }}
        shell: bash
        timeout-minutes: 165
        run: |
          set -euo pipefail
          mkdir -p work/ci
          python3 -B scripts/tools/verify_workflow.py full --output work/ci/full-acceptance
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/ci/full-acceptance/summary.json").read_text())
          assert report.get("full_acceptance") is True, report
          assert report.get("status") == "passed", report
          print("Full milestone acceptance confirmed:", len(report.get("commands", [])), "stages")
          PY

      - name: Preserve full-acceptance summary and stage logs
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.scope == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-acceptance-summary-${{ github.run_id }}
          path: |
            work/ci/full-acceptance/summary.json
            work/ci/full-acceptance/dependencies.json
            work/ci/full-acceptance/*.log
          retention-days: 3
          if-no-files-found: ignore
